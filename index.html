<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<title>ROMANCIA</title>


<style>

/* =========================================================
   VARIABLES
========================================================= */

:root{

  --bg:#000;

  --fg:#fff;

  --mute:#8a8a8a;

  --line:rgba(255,255,255,.14);

  --clip-h:min(60vh,540px);

  --clip-w:calc(var(--clip-h) * 16 / 9);

  box-sizing:border-box;

}


/* =========================================================
   RESET
========================================================= */

*{

  box-sizing:border-box;

  margin:0;

  padding:0;

}


html,
body{

  height:100%;

  background:var(--bg);

  overflow:hidden;

}


body{

  font-family:
    "Helvetica Neue",
    Helvetica,
    Arial,
    sans-serif;

  color:var(--fg);

  -webkit-font-smoothing:antialiased;

  padding-top:
    env(safe-area-inset-top,0px);

  padding-bottom:
    env(safe-area-inset-bottom,0px);

}


button{

  font-family:inherit;

  background:none;

  border:none;

  color:inherit;

  cursor:pointer;

}


a{

  color:inherit;

  text-decoration:none;

}


/* =========================================================
   INTRO
========================================================= */

#intro{

  position:fixed;

  inset:0;

  background:#000;

  z-index:100;

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;

  gap:28px;

  transition:opacity 900ms ease;

}


#intro.hide{

  opacity:0;

  pointer-events:none;

}


#intro h1{

  font-weight:700;

  letter-spacing:-0.085em;

  font-size:
    clamp(56px,14vw,180px);

  line-height:1;

}


#playBtn{

  letter-spacing:.2em;

  font-size:12px;

  font-weight:400;

  animation:
    pulse 1.8s ease-in-out infinite;

  padding:6px 2px;

  border-bottom:
    1px solid rgba(255,255,255,.3);

}


@keyframes pulse{

  0%{
    opacity:1;
  }

  50%{
    opacity:.45;
  }

  100%{
    opacity:1;
  }

}


@media (prefers-reduced-motion:reduce){

  #playBtn{
    animation:none;
  }

}


/* =========================================================
   APP
========================================================= */

#app{

  position:fixed;

  inset:0;

  opacity:0;

  transition:opacity 900ms ease;

}


#app.show{

  opacity:1;

}


/* =========================================================
   NAVIGATION
========================================================= */

nav{

  position:fixed;

  top:0;
  left:0;
  right:0;

  z-index:50;

  top:
    env(safe-area-inset-top,0px);

  display:flex;

  align-items:center;

  justify-content:space-between;

  padding:22px 28px;

  font-size:11px;

  letter-spacing:.14em;

  pointer-events:none;

}


nav *{
  pointer-events:auto;
}


.nav-left{

  font-size:13px;

  letter-spacing:-.05em;

  font-weight:700;

}


.nav-center{

  display:flex;

  gap:22px;

}


.nav-center button{

  opacity:.55;

  transition:opacity 250ms ease;

  padding:4px 0;

}


.nav-center button.active{

  opacity:1;

}


.nav-center button:hover{

  opacity:1;

}


.nav-right{

  opacity:.85;

}


.nav-right:hover{

  opacity:1;

}


/* =========================================================
   RAIL
========================================================= */

#rail{

  height:100%;

  width:100%;

  max-width:100%;

  overflow-x:auto;

  overflow-y:hidden;

  scrollbar-width:none;

  -ms-overflow-style:none;

  display:flex;

  align-items:center;

  scroll-behavior:auto;

}


#rail::-webkit-scrollbar{
  display:none;
}


.view{

  flex:0 0 auto;

  display:flex;

  align-items:center;

  height:100%;

  padding:0 5vw;

  gap:1.2vw;

  max-width:100%;

}


.view.hidden{
  display:none;
}


/* =========================================================
   VIDEO CARDS
========================================================= */

.clip-wrap{

  display:flex;

  flex-direction:column;

  flex:0 0 auto;

  max-width:100%;

}


.clip{

  width:var(--clip-w);

  height:var(--clip-h);

  background:#0c0c0c;

  position:relative;

  cursor:default;

  overflow:hidden;

}


.clip.playable{
  cursor:pointer;
}


.clip iframe{

  width:100%;

  height:100%;

  border:0;

  display:block;

}


.clip .ph{

  position:absolute;

  inset:0;

  display:flex;

  align-items:center;

  justify-content:center;

  color:var(--mute);

  font-size:12px;

  letter-spacing:.12em;

}


/* =========================================================
   VIMEO THUMBNAIL
========================================================= */

.vimeo-thumb{

  position:absolute;

  inset:0;

  width:100%;

  height:100%;

  object-fit:cover;

  display:block;

}


/* =========================================================
   VIMEO PLAY BUTTON
========================================================= */

.vimeo-play{

  position:absolute;

  left:50%;

  top:50%;

  transform:
    translate(-50%,-50%);

  width:68px;

  height:48px;

  background:#1ab7ea;

  border-radius:14px;

  display:flex;

  align-items:center;

  justify-content:center;

  transition:
    transform 200ms ease,
    opacity 200ms ease;

}


.vimeo-play-icon{

  width:0;

  height:0;

  border-top:
    9px solid transparent;

  border-bottom:
    9px solid transparent;

  border-left:
    14px solid #fff;

  margin-left:4px;

}


.clip.playable:hover .vimeo-play{

  transform:
    translate(-50%,-50%)
    scale(1.08);

}


/* =========================================================
   YOUTUBE THUMBNAIL
========================================================= */

.youtube-thumb{

  position:absolute;

  inset:0;

  width:100%;

  height:100%;

  object-fit:cover;

  display:block;

}


.youtube-play{

  position:absolute;

  left:50%;

  top:50%;

  transform:
    translate(-50%,-50%);

  width:68px;

  height:48px;

  background:#ff0000;

  border-radius:14px;

  display:flex;

  align-items:center;

  justify-content:center;

  transition:
    transform 200ms ease,
    opacity 200ms ease;

}


.youtube-play-icon{

  width:0;

  height:0;

  border-top:
    9px solid transparent;

  border-bottom:
    9px solid transparent;

  border-left:
    14px solid #fff;

  margin-left:4px;

}


.clip.playable:hover .youtube-play{

  transform:
    translate(-50%,-50%)
    scale(1.08);

}


/* =========================================================
   DEFAULT PLAY
========================================================= */

.clip .dot{

  position:absolute;

  left:50%;

  top:50%;

  transform:
    translate(-50%,-50%);

  width:44px;

  height:44px;

  border:
    1px solid rgba(255,255,255,.4);

  border-radius:50%;

  display:flex;

  align-items:center;

  justify-content:center;

  opacity:0;

  transition:opacity 250ms ease;

}


.clip.playable:hover .dot{

  opacity:1;

}


.clip .dot::after{

  content:"";

  border-left:
    10px solid #fff;

  border-top:
    6px solid transparent;

  border-bottom:
    6px solid transparent;

  margin-left:3px;

}


/* =========================================================
   META
========================================================= */

.meta{

  margin-top:16px;

  width:var(--clip-w);

}


.meta .t{

  font-size:13px;

  font-weight:400;

}


.meta .y{

  font-size:11px;

  color:var(--mute);

  margin-top:3px;

}


/* =========================================================
   ALBUMS
========================================================= */

.album-group{

  display:contents;

}


.tracks-inner{

  display:contents;

}


/* =========================================================
   COVERS
========================================================= */

.cover{

  flex:0 0 auto;

  width:var(--clip-h);

  height:var(--clip-h);

  background:#111;

  display:flex;

  align-items:center;

  justify-content:center;

  overflow:hidden;

  color:var(--mute);

  font-size:11px;

  letter-spacing:.14em;

  text-align:center;

}


.cover img{

  width:100%;

  height:100%;

  object-fit:cover;

  display:block;

}


.cover-wrap{

  display:flex;

  flex-direction:column;

  flex:0 0 auto;

}


.cover-wrap .meta{

  width:var(--clip-h);

}


/* =========================================================
   CONTACT
========================================================= */

#contact{

  position:fixed;

  inset:0;

  background:#000;

  z-index:200;

  display:none;

  align-items:center;

  justify-content:center;

  padding:80px 7vw;

  overflow-y:auto;

}


#contact.open{

  display:flex;

}


/* =========================================================
   CONTACT GRID
========================================================= */

.contact-grid{

  width:100%;

  max-width:1250px;

  display:grid;

  grid-template-columns:
    minmax(0,1fr)
    1px
    minmax(0,1fr);

  gap:7vw;

  align-items:start;

}


/* =========================================================
   CONTACT LEFT
========================================================= */

.contact-left h2{

  font-size:
    clamp(42px,5vw,76px);

  line-height:.95;

  font-weight:400;

  letter-spacing:-.055em;

  margin-bottom:70px;

}


.info-block{

  margin-bottom:30px;

}


.info-label{

  font-size:9px;

  letter-spacing:.15em;

  text-transform:uppercase;

  color:var(--mute);

  margin-bottom:7px;

}


.info-value{

  font-size:13px;

  line-height:1.55;

}


.info-value a{

  transition:opacity 200ms ease;

}


.info-value a:hover{

  opacity:.5;

}


/* =========================================================
   CONTACT DIVIDER
========================================================= */

.contact-divider{

  width:1px;

  height:100%;

  min-height:520px;

  background:var(--line);

}


/* =========================================================
   CONTACT FORM
========================================================= */

.contact-right{

  width:100%;

}


.contact-form{

  width:100%;

}


.form-row{

  display:grid;

  grid-template-columns:
    1fr
    1fr;

  gap:25px;

}


.field{

  margin-bottom:30px;

}


.field label{

  display:block;

  font-size:9px;

  letter-spacing:.15em;

  text-transform:uppercase;

  color:var(--mute);

  margin-bottom:9px;

}


.field input,
.field select,
.field textarea{

  width:100%;

  background:transparent;

  border:none;

  border-bottom:
    1px solid var(--line);

  color:#fff;

  font-family:inherit;

  font-size:13px;

  padding:10px 0;

  border-radius:0;

  outline:none;

  transition:border-color 200ms ease;

}


.field input::placeholder,
.field textarea::placeholder{

  color:#555;

}


.field input:focus,
.field select:focus,
.field textarea:focus{

  border-color:#fff;

}


.field select{

  appearance:none;

  -webkit-appearance:none;

  cursor:pointer;

  color:#fff;

}


.field select option{

  background:#000;

  color:#fff;

}


.field textarea{

  min-height:120px;

  resize:vertical;

  line-height:1.5;

}


/* =========================================================
   FORM BUTTON
========================================================= */

.form-submit{

  margin-top:10px;

  font-family:inherit;

  font-size:10px;

  letter-spacing:.16em;

  text-transform:uppercase;

  color:#fff;

  border-bottom:
    1px solid rgba(255,255,255,.5);

  padding-bottom:6px;

  transition:
    opacity 200ms ease,
    border-color 200ms ease;

}


.form-submit:hover{

  opacity:.5;

  border-color:#fff;

}


/* =========================================================
   FORM MESSAGE
========================================================= */

.form-msg{

  display:none;

  margin-top:20px;

  font-size:11px;

  color:var(--mute);

  line-height:1.5;

}


.form-msg.show{

  display:block;

}


/* =========================================================
   CLOSE CONTACT
========================================================= */

#cClose{

  position:absolute;

  top:26px;

  right:30px;

  font-family:inherit;

  font-size:10px;

  letter-spacing:.15em;

  color:#fff;

  opacity:.65;

  transition:opacity 200ms ease;

}


#cClose:hover{

  opacity:1;

}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width:680px){

  :root{

    --clip-h:34vh;

    --clip-w:
      calc(var(--clip-h) * 16 / 9);

  }


  html,
  body{

    width:100%;

    max-width:100%;

    overflow:hidden;

  }


  #rail{

    width:100%;

    max-width:100%;

    flex-direction:column;

    align-items:center;

    overflow-x:hidden;

    overflow-y:auto;

  }


  .view{

    flex-direction:column;

    height:auto;

    width:100%;

    max-width:100%;

    align-items:center;

    padding:14vh 0;

    gap:8vh;

  }


  .clip{

    width:90vw;

    max-width:90vw;

    height:
      calc(90vw * 9 / 16);

  }


  .clip-wrap{

    width:90vw;

    max-width:90vw;

  }


  .cover{

    width:80vw;

    height:80vw;

    max-width:80vw;

    max-height:80vw;

  }


  .cover-wrap{

    width:100%;

    max-width:100%;

    align-items:center;

    cursor:pointer;

  }


  .cover-wrap .meta{

    width:80vw;

    max-width:80vw;

  }


  .meta{

    max-width:100%;

  }


  .album-group{

    display:flex;

    flex-direction:column;

    align-items:center;

    width:100%;

    max-width:100%;

    flex:0 0 auto;

  }


  .tracks-inner{

    display:flex;

    flex-direction:column;

    align-items:center;

    width:100%;

    max-width:100%;

    gap:8vh;

    overflow:hidden;

    max-height:0;

    opacity:0;

    transition:
      max-height 450ms ease,
      opacity 350ms ease,
      margin-top 450ms ease;

    margin-top:0;

  }


  .tracks-inner.expanded{

    max-height:6000px;

    opacity:1;

    margin-top:8vh;

  }


  nav{

    padding:18px 18px;

  }


  /* CONTACT MOBILE */

  #contact{

    align-items:flex-start;

    padding:
      100px
      24px
      60px;

    overflow-y:auto;

  }


  .contact-grid{

    display:flex;

    flex-direction:column;

    width:100%;

    gap:50px;

  }


  .contact-left h2{

    font-size:
      clamp(42px,13vw,64px);

    margin-bottom:50px;

  }


  .info-block{

    margin-bottom:24px;

  }


  .contact-divider{

    width:100%;

    height:1px;

    min-height:1px;

  }


  .form-row{

    grid-template-columns:1fr;

    gap:0;

  }


  .field{

    margin-bottom:26px;

  }


  #cClose{

    top:20px;

    right:20px;

  }

}


/* =========================================================
   ACCESSIBILITY
========================================================= */

:focus-visible{

  outline:1px solid #fff;

  outline-offset:2px;

}

</style>

</head>

<div id="intro">

</div>



<!-- =======================================================
     APP

<div id="app">

  <nav>

    </div>

            <option>

            </option>

            <option>

              Content Créateur
            </option>

            <option>
              Documentaire
            </option>

            <option>
              Autre
            </option>

          </select>

        </div>



        <div class="field">

          <label for="cbudget">
            Budget estimé
          </label>

          <select
            id="cbudget"
            name="budget"
            required
          >

            <option
              value=""
              disabled
              selected
            >
              Sélectionner
            </option>

            <option>
              Moins de 2 000 €
            </option>

            <option>
              2 000 – 5 000 €
            </option>

            <option>
              5 000 – 15 000 €
            </option>

            <option>
              15 000 € et plus
            </option>

          </select>

        </div>



        <div class="field">

          <label for="cmsg">
            Description du projet
          </label>

          <textarea
            id="cmsg"
            name="message"
            placeholder="Décrivez votre projet, vos attentes, votre calendrier…"
            required
          ></textarea>

        </div>



        <button
          type="submit"
          class="form-submit"

          Envoyer la demande
        </button>



        <div
          class="form-msg"
          id="cnote"
        ></div>


      </form>

    </div>


  </div>

</div>

  );

  (p,i)=>{

              src="${album.cover}"
              alt="${album.title}"

    /* TRACKS */

      document.createElement(
        'div'

      'tracks-inner';

      ()=>{

          !isMobileLayout()

          'clip-wrap';


        wrap.innerHTML = `

          <div
            class="clip${t.youtube ? ' playable' : ''}"

            data-album="${ai}"
            data-i="${ti}"

              ? `

/* =========================================================
   INLINE VIDEO PLAYER
========================================================= */

function playInline(
  el,
  kind,
  id
){

  if(
    kind === 'vimeo'
  ){

    el.innerHTML = `

      <iframe
        src="https://player.vimeo.com/video/${id}?autoplay=1&title=0&byline=0&portrait=0&badge=0&dnt=1"
        allow="autoplay; fullscreen; picture-in-picture"
        allowfullscreen
        loading="lazy">
      </iframe>

    `;

  }

  else{

    el.innerHTML = `

      <iframe
        src="https://www.youtube.com/embed/${id}?autoplay=1&rel=0"
        allow="autoplay; encrypted-media; picture-in-picture"
        allowfullscreen
        loading="lazy">
      </iframe>

    `;

  }

}



/* =========================================================
   VIDEO CLICK HANDLING
========================================================= */

document
  .querySelectorAll(
    '.clip.playable'
  )
  .forEach(
    el=>{

      el.addEventListener(
        'click',
        ()=>{

          const i =
            +el.dataset.i;


          /* VIMEO */

          if(
            el.dataset.kind === 'vimeo'
          ){

            const p =
              projects[i];


            if(p.vimeo){

              playInline(
                el,
                'vimeo',
                p.vimeo
              );

            }

          }


          /* YOUTUBE */

          else{

            const t =
              albums[
                +el.dataset.album
              ].tracks[i];


            if(t.youtube){

              playInline(
                el,
                'youtube',
                t.youtube
              );

            }

          }

        }
      );

    }
  );

/* =========================================================
   MOBILE CHECK
========================================================= */

const isMobileLayout =
  () =>
    window.matchMedia(
      '(max-width:680px)'
    ).matches;



/* =========================================================
   HORIZONTAL SCROLL
========================================================= */

const rail =
  document.getElementById(
    'rail'
  );


rail.addEventListener(
  'wheel',
  (e)=>{

    if(
      isMobileLayout()
    ){

      return;

    }


    if(
      Math.abs(e.deltaY) >
      Math.abs(e.deltaX)
    ){

      e.preventDefault();

      rail.scrollLeft +=
        e.deltaY;

    }

  },
  {
    passive:false
  }
);



/* =========================================================
   NAVIGATION
========================================================= */

document
  .querySelectorAll(
    '.nav-center button'
  )
  .forEach(
    btn=>{

      btn.addEventListener(
        'click',
        ()=>{

          document
            .querySelectorAll(
              '.nav-center button'
            )
            .forEach(
              b =>
                b.classList.remove(
                  'active'
                )
            );


          btn.classList.add(
            'active'
          );


          const view =
            btn.dataset.view;


          document
            .getElementById(
              'filmsView'
            )
            .classList.toggle(
              'hidden',
              view !== 'films'
            );


          document
            .getElementById(
              'music'
            )
            .classList.toggle(
              'hidden',
              view !== 'music'
            );


          rail.scrollTo(
            0,
            0
          );

        }
      );

    }
  );

/* =========================================================
   CONTACT FORM
========================================================= */

document
  .getElementById(
    'cform'
  )
  .addEventListener(
    'submit',
    async (e)=>{

      e.preventDefault();


      const note =
        document.getElementById(
          'cnote'
        );


      const name =
        document.getElementById(
          'cname'
        ).value.trim();


      const email =
        document.getElementById(
          'cemail'
        ).value.trim();


      const type =
        document.getElementById(
          'ctype'
        ).value;


      const budget =
        document.getElementById(
          'cbudget'
        ).value;


      const message =
        document.getElementById(
          'cmsg'
        ).value.trim();


      if(
        !FORMSPREE_ID
      ){

        note.textContent =
          'Formulaire non configuré — ajoute ton ID Formspree dans le code.';

        note.classList.add(
          'show'
        );

        return;

      }


      try{

        const res =
          await fetch(
            `https://formspree.io/f/${FORMSPREE_ID}`,
            {

              method:'POST',

              headers:{

                'Content-Type':
                  'application/json',

                'Accept':
                  'application/json'

              },

              body:
                JSON.stringify({

                  name:name,

                  email:email,

                  type:type,

                  budget:budget,

                  message:message

                })

            }
          );


        if(
          res.ok
        ){

          document
            .getElementById(
              'cform'
            )
            .reset();


          note.textContent =
            'Message envoyé — on vous répond rapidement.';

          note.classList.add(
            'show'
          );

        }

        else{

          note.textContent =
            'Une erreur est survenue. Veuillez réessayer.';

          note.classList.add(
            'show'
          );

        }

      }

      catch(err){

        note.textContent =
          'Une erreur est survenue. Veuillez réessayer.';

        note.classList.add(
          'show'
        );

      }

    }
  );



/* =========================================================
   ESCAPE
========================================================= */

document.addEventListener(
  'keydown',
  (e)=>{

    if(
      e.key === 'Escape'
    ){

      contact.classList.remove(
        'open'
      );

    }

  }
);

</script>
